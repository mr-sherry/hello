<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <title>Document</title>
  </head>
  <body>
    <div class="carousel slide" id="carouselMainDiv" data-bs-ride="carousel">
      <!-- indi -->
      <div class="carousel-indicators">
        <button
          data-bs-target="#carouselMainDiv"
          data-bs-slide-to="0"
          class="active"
        ></button>
        <button data-bs-target="#carouselMainDiv" data-bs-slide-to="1"></button>
        <button data-bs-target="#carouselMainDiv" data-bs-slide-to="2"></button>
      </div>
      <!-- images -->
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img
            class="d-block"
            width="100%"
            src="https://images.pexels.com/photos/326055/pexels-photo-326055.jpeg?cs=srgb&dl=pexels-pixabay-326055.jpg&fm=jpg"
            alt=""
          />
        </div>
        <div class="carousel-item">
          <img
            class="d-block"
            width="100%"
            src="https://img.freepik.com/premium-photo/silhouette-butterfly-flower-sunset_1176045-17428.jpg?semt=ais_hybrid&w=740&q=80"
            alt=""
          />
        </div>
        <div class="carousel-item">
          <img
            class="d-block"
            width="100%"
            src="https://images.pexels.com/photos/326055/pexels-photo-326055.jpeg?cs=srgb&dl=pexels-pixabay-326055.jpg&fm=jpg"
            alt=""
          />
          <div class="carousel-caption">
            <h1>
              Lorem ipsum dolor sit amet consectetur adipisicing elit. Quisquam
              aliquid, facilis veritatis voluptate ipsum repellendus in soluta.
              Distinctio magni expedita nihil aspernatur optio totam, maiores
              voluptatibus, nemo magnam impedit laudantium.
            </h1>
          </div>
        </div>
      </div>

      <!-- left right -->
      <div>
        <button
          class="carousel-control-prev"
          data-bs-target="#carouselMainDiv"
          data-bs-slide="prev"
        >
          <span class="carousel-control-prev-icon"></span>
        </button>
        <button
          class="carousel-control-next"
          data-bs-target="#carouselMainDiv"
          data-bs-slide="next"
        >
          <span class="carousel-control-next-icon"></span>
        </button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
